server:
  port: ${NOTIFICATION_PORT:8083}

spring:
  application:
    name: notification-service

  security:
    jwt:
      public-key: classpath:keys/public.pem
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/oauth2/jwks}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      lettuce:
        command-timeout: 2s        # Redis 2s'de yanıt vermezse timeout → cache miss
        shutdown-timeout: 100ms
  cache:
    type: redis
    redis:
      time-to-live: 10m

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/notification-db}
    username: ${DB_USERNAME:notification}
    password: ${DB_PASSWORD:notification}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      initialization-fail-timeout: -1
      leak-detection-threshold: 10000
      keepalive-time: 300000

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    connect-retries: 20          # 20 × 5s = 100s (Docker container'ın hazır olması için yeterli süre)
    connect-retries-interval: 5s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    consumer:
      group-id: notification-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "com.stop.*"

services:
  match-service:
    base-url: ${MATCH_SERVICE_URL:http://localhost:8082/api/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    persistAuthorization: true

logging:
  file:
    name: logs/notification-service.log
  level:
    root: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.apache.kafka: ERROR
  pattern:
    level: "%5p [notification-service]"
