x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-db-healthcheck: &db-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

x-redis-healthcheck: &redis-healthcheck
  test: ["CMD", "redis-cli", "ping"]
  interval: 10s
  timeout: 5s
  retries: 5

x-service-healthcheck: &service-healthcheck
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 90s

x-java-resources: &java-resources
  deploy:
    resources:
      limits:
        memory: 512m
      reservations:
        memory: 256m

x-db-resources: &db-resources
  deploy:
    resources:
      limits:
        memory: 256m
      reservations:
        memory: 128m

x-kafka-resources: &kafka-resources
  deploy:
    resources:
      limits:
        memory: 768m
      reservations:
        memory: 512m

x-redis-resources: &redis-resources
  deploy:
    resources:
      limits:
        memory: 128m
      reservations:
        memory: 64m

x-broker-and-redis-depends-on: &redis-broker-depends-on
  broker:
    condition: service_healthy
  redis:
    condition: service_healthy

networks:
  backend:
  identity-db-net:
  match-db-net:
  communication-db-net:
  notification-db-net:

services:
  # ------ INFRASTRUCTURE ------
  broker:
    image: apache/kafka:4.2.0
    container_name: broker
    <<: *kafka-resources
    networks:
      - backend
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: redis
    <<: *redis-resources
    networks:
      - backend
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *redis-healthcheck

  # ------ DATABASES ------

  communication-db:
    image: postgres:15
    container_name: communication-db
    <<: *db-resources
    networks:
      - communication-db-net
    environment:
      POSTGRES_DB: ${COMMUNICATION_DB_NAME}
      POSTGRES_USER: ${COMMUNICATION_DB_USER}
      POSTGRES_PASSWORD: ${COMMUNICATION_DB_PASSWORD}
    volumes:
      - communication_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *db-healthcheck

  identity-db:
    image: postgres:15
    container_name: identity-db
    <<: *db-resources
    networks:
      - identity-db-net
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME}
      POSTGRES_USER: ${IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}
    volumes:
      - identity_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *db-healthcheck

  match-db:
    image: postgres:15
    container_name: match-db
    <<: *db-resources
    networks:
      - match-db-net
    environment:
      POSTGRES_DB: ${MATCH_DB_NAME}
      POSTGRES_USER: ${MATCH_DB_USER}
      POSTGRES_PASSWORD: ${MATCH_DB_PASSWORD}
    volumes:
      - match_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *db-healthcheck

  notification-db:
    image: postgres:15
    container_name: notification-db
    <<: *db-resources
    networks:
      - notification-db-net
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    healthcheck: *db-healthcheck

  # ------ SERVICES ------

  communication-service:
    container_name: communication-service
    build:
      context: ../communication-service
    image: ghcr.io/mehmettguzell/stop/communication-service:${IMAGE_TAG:-latest}
    <<: *java-resources
    networks:
      - backend
      - communication-db-net
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      DB_URL: ${COMMUNICATION_DB_URL}
      DB_USERNAME: ${COMMUNICATION_DB_USER}
      DB_PASSWORD: ${COMMUNICATION_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_URL: ${REDIS_URL}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      communication-db:
        condition: service_healthy
      <<: *redis-broker-depends-on
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8084/actuator/health || exit 1",
        ]
      <<: *service-healthcheck
    restart: unless-stopped
    logging: *default-logging

  identity-service:
    container_name: identity-service
    build:
      context: ../identity-service
    image: ghcr.io/mehmettguzell/stop/identity-service:${IMAGE_TAG:-latest}
    <<: *java-resources
    networks:
      - backend
      - identity-db-net
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      DB_URL: ${IDENTITY_DB_URL}
      DB_USERNAME: ${IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}

      REDIS_URL: ${REDIS_URL}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}

      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
    depends_on:
      identity-db:
        condition: service_healthy
      <<: *redis-broker-depends-on
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8081/actuator/health || exit 1",
        ]
      <<: *service-healthcheck
    restart: unless-stopped
    logging: *default-logging

  match-service:
    container_name: match-service
    build:
      context: ../match-service
    image: ghcr.io/mehmettguzell/stop/match-service:${IMAGE_TAG:-latest}
    <<: *java-resources
    networks:
      - backend
      - match-db-net
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      DB_URL: ${MATCH_DB_URL}
      DB_USERNAME: ${MATCH_DB_USER}
      DB_PASSWORD: ${MATCH_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_URL: ${REDIS_URL}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      match-db:
        condition: service_healthy
      <<: *redis-broker-depends-on
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8082/actuator/health || exit 1",
        ]
      <<: *service-healthcheck
    restart: unless-stopped
    logging: *default-logging

  notification-service:
    container_name: notification-service
    build:
      context: ../notification-service
    image: ghcr.io/mehmettguzell/stop/notification-service:${IMAGE_TAG:-latest}
    <<: *java-resources
    networks:
      - backend
      - notification-db-net
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      DB_URL: ${NOTIFICATION_DB_URL}
      DB_USERNAME: ${NOTIFICATION_DB_USER}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_URL: ${REDIS_URL}

      MATCH_SERVICE_URL: ${MATCH_SERVICE_URL}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      notification-db:
        condition: service_healthy
      <<: *redis-broker-depends-on
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8083/actuator/health || exit 1",
        ]
      <<: *service-healthcheck
    restart: unless-stopped
    logging: *default-logging

  # ------ GATEWAY ------

  api-gateway:
    container_name: api-gateway
    build:
      context: ../api-gateway
    image: ghcr.io/mehmettguzell/stop/api-gateway:${IMAGE_TAG:-latest}
    <<: *java-resources
    networks:
      - backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      GATEWAY_IDENTITY_URI: ${GATEWAY_IDENTITY_URI}
      GATEWAY_MODERATION_URI: ${GATEWAY_MODERATION_URI}
      GATEWAY_MATCH_URI: ${GATEWAY_MATCH_URI}
      GATEWAY_NOTIFICATION_URI: ${GATEWAY_NOTIFICATION_URI}
      GATEWAY_COMMUNICATION_URI: ${GATEWAY_COMMUNICATION_URI}
      GATEWAY_COMMUNICATION_WS_URI: ${GATEWAY_COMMUNICATION_WS_URI}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      identity-service:
        condition: service_healthy
      match-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      communication-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO /dev/null http://localhost:8080/actuator/health || exit 1",
        ]
      <<: *service-healthcheck
    restart: unless-stopped
    logging: *default-logging

volumes:
  identity_data:
  match_data:
  notification_data:
  communication_data:
  redis_data:
