services:
  broker:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  communication-db:
    image: postgres:15
    container_name: communication-db
    environment:
      POSTGRES_DB: communication-db
      POSTGRES_USER: communication
      POSTGRES_PASSWORD: communication
    volumes:
      - communication_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U communication -d communication-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-db:
    image: postgres:15
    container_name: identity-db
    environment:
      POSTGRES_DB: identity-db
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    volumes:
      - identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  match-db:
    image: postgres:15
    container_name: match-db
    environment:
      POSTGRES_DB: match-db
      POSTGRES_USER: match
      POSTGRES_PASSWORD: match
    volumes:
      - match_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U match -d match-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:15
    container_name: notification-db
    environment:
      POSTGRES_DB: notification-db
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    volumes:
      - notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification-db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis

    volumes:
      - redis_data:/data
    restart: unless-stopped

    # ------ SERVICES ------

  api-gateway:
    container_name: api-gateway
    build:
      context: ../api-gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_IDENTITY_URI: http://identity-service:8081
      GATEWAY_MODERATION_URI: http://identity-service:8081
      GATEWAY_MATCH_URI: http://match-service:8082
      GATEWAY_NOTIFICATION_URI: http://notification-service:8083
      GATEWAY_COMMUNICATION_URI: http://communication-service:8084
      GATEWAY_COMMUNICATION_WS_URI: ws://communication-service:8084
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      - identity-service
      - match-service
      - notification-service
      - communication-service
    restart: unless-stopped

  communication-service:
    container_name: communication-service
    build:
      context: ../communication-service
    environment:
      DB_URL: jdbc:postgresql://communication-db:5432/communication-db
      DB_USERNAME: communication
      DB_PASSWORD: communication
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      IDENTITY_JWKS_URI: http://identity-service:8081/oauth2/jwks
      REDIS_URL: redis://redis:6379
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      communication-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped

  identity-service:
    container_name: identity-service
    build:
      context: ../identity-service
    environment:
      DB_URL: jdbc:postgresql://identity-db:5432/identity-db
      DB_USERNAME: identity
      DB_PASSWORD: identity
      REDIS_URL: redis://redis:6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker:9092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
    depends_on:
      identity-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped

  match-service:
    container_name: match-service
    build:
      context: ../match-service
    environment:
      DB_URL: jdbc:postgresql://match-db:5432/match-db
      DB_USERNAME: match
      DB_PASSWORD: match
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      REDIS_URL: redis://redis:6379
      IDENTITY_JWKS_URI: http://identity-service:8081/oauth2/jwks
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      match-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped

  notification-service:
    container_name: notification-service
    build:
      context: ../notification-service
    environment:
      DB_URL: jdbc:postgresql://notification-db:5432/notification-db
      DB_USERNAME: notification
      DB_PASSWORD: notification
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      REDIS_URL: redis://redis:6379
      IDENTITY_JWKS_URI: http://identity-service:8081/oauth2/jwks
      MATCH_SERVICE_URL: http://match-service:8082/api/v1
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    depends_on:
      notification-db:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped

  # ------ UI -------
  # TODO: We might delete these

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
    depends_on:
      - broker

volumes:
  identity_data:
  match_data:
  notification_data:
  communication_data:
  redis_data:
