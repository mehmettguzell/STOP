services:
  broker:
    image: apache/kafka:latest
    container_name: broker
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,EXTERNAL://localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  communication-db:
    image: postgres:15
    container_name: communication-db
    environment:
      POSTGRES_DB: ${COMMUNICATION_DB_NAME}
      POSTGRES_USER: ${COMMUNICATION_DB_USER}
      POSTGRES_PASSWORD: ${COMMUNICATION_DB_PASSWORD}
    volumes:
      - communication_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  identity-db:
    image: postgres:15
    container_name: identity-db
    environment:
      POSTGRES_DB: ${IDENTITY_DB_NAME}
      POSTGRES_USER: ${IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}
    volumes:
      - identity_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  match-db:
    image: postgres:15
    container_name: match-db
    environment:
      POSTGRES_DB: ${MATCH_DB_NAME}
      POSTGRES_USER: ${MATCH_DB_USER}
      POSTGRES_PASSWORD: ${MATCH_DB_PASSWORD}
    volumes:
      - match_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  notification-db:
    image: postgres:15
    container_name: notification-db
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME}
      POSTGRES_USER: ${NOTIFICATION_DB_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis

    volumes:
      - redis_data:/data
    restart: unless-stopped

    # ------ SERVICES ------

  api-gateway:
    container_name: api-gateway
    build:
      context: ../api-gateway
    ports:
      - "8080:8080"
    environment:
      GATEWAY_IDENTITY_URI: ${GATEWAY_IDENTITY_URI}
      GATEWAY_MODERATION_URI: ${GATEWAY_MODERATION_URI}
      GATEWAY_MATCH_URI: ${GATEWAY_MATCH_URI}
      GATEWAY_NOTIFICATION_URI: ${GATEWAY_NOTIFICATION_URI}
      GATEWAY_COMMUNICATION_URI: ${GATEWAY_COMMUNICATION_URI}
      GATEWAY_COMMUNICATION_WS_URI: ${GATEWAY_COMMUNICATION_WS_URI}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}

    depends_on:
      - identity-service
      - match-service
      - notification-service
      - communication-service

    restart: unless-stopped

  communication-service:
    container_name: communication-service
    build:
      context: ../communication-service

    environment:
      DB_URL: ${COMMUNICATION_DB_URL}
      DB_USERNAME: ${COMMUNICATION_DB_USER}
      DB_PASSWORD: ${COMMUNICATION_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_URL: ${REDIS_URL}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}

    depends_on:
      communication-db:
        condition: service_healthy
      broker:
        condition: service_healthy

    restart: unless-stopped

  identity-service:
    container_name: identity-service
    build:
      context: ../identity-service

    environment:
      DB_URL: ${IDENTITY_DB_URL}
      DB_USERNAME: ${IDENTITY_DB_USER}
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}

      REDIS_URL: ${REDIS_URL}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}

    depends_on:
      identity-db:
        condition: service_healthy
      broker:
        condition: service_healthy

    restart: unless-stopped

  match-service:
    container_name: match-service
    build:
      context: ../match-service

    environment:
      DB_URL: ${MATCH_DB_URL}
      DB_USERNAME: ${MATCH_DB_USER}
      DB_PASSWORD: ${MATCH_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_URL: ${REDIS_URL}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}

    depends_on:
      match-db:
        condition: service_healthy
      broker:
        condition: service_healthy

    restart: unless-stopped

  notification-service:
    container_name: notification-service
    build:
      context: ../notification-service

    environment:
      DB_URL: ${NOTIFICATION_DB_URL}
      DB_USERNAME: ${NOTIFICATION_DB_USER}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      REDIS_URL: ${REDIS_URL}

      MATCH_SERVICE_URL: ${MATCH_SERVICE_URL}

      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}

    depends_on:
      notification-db:
        condition: service_healthy
      broker:
        condition: service_healthy

    restart: unless-stopped

volumes:
  identity_data:
  match_data:
  notification_data:
  communication_data:
  redis_data:
