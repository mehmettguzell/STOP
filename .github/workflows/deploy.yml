name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM (no SSH)
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          cat > /tmp/deploy.sh <<EOF
          set -euo pipefail
          cd /opt/STOP
          git pull origin main

          REGION=${AWS_REGION}
          ECR_REGISTRY=603366204207.dkr.ecr.eu-north-1.amazonaws.com
          NEW_TAG="${DEPLOY_SHA}"
          PREV_TAG_FILE=".last-deployed-tag"
          PREV_TAG=\$(cat "\$PREV_TAG_FILE" 2>/dev/null || echo "latest")

          # Host authenticates to ECR using its own IAM instance role — no long-lived
          # AWS credentials are stored anywhere in CI or on the host.
          aws ecr get-login-password --region "\$REGION" | \
            docker login --username AWS --password-stdin "\$ECR_REGISTRY"

          deploy_tag() {
            IMAGE_TAG="\$1" ECR_REGISTRY="\$ECR_REGISTRY" \
              docker compose -f docker/docker-compose.yml pull
            IMAGE_TAG="\$1" ECR_REGISTRY="\$ECR_REGISTRY" \
              docker compose -f docker/docker-compose.yml up -d
          }

          wait_healthy() {
            for svc in identity-service match-service communication-service notification-service api-gateway; do
              timeout 120 bash -c "until [ \\"\\\$(docker inspect -f '{{.State.Health.Status}}' \$svc 2>/dev/null)\\" = 'healthy' ]; do sleep 5; done" \
                || return 1
            done
          }

          echo "Deploying tag \${NEW_TAG} (previous: \${PREV_TAG})"
          deploy_tag "\$NEW_TAG"

          if wait_healthy; then
            echo "\$NEW_TAG" > "\$PREV_TAG_FILE"
            echo "Deploy succeeded."
          else
            echo "Healthcheck failed — rolling back to \${PREV_TAG}"
            deploy_tag "\$PREV_TAG"
            wait_healthy || echo "WARNING: rollback healthcheck also failed, manual intervention required"
            exit 1
          fi
          EOF

          # Turn the script into the JSON array format AWS-RunShellScript expects,
          # one array element per line — avoids shell-escaping the whole script
          # through --parameters shorthand syntax.
          jq -Rs '{commands: split("\n")}' /tmp/deploy.sh > /tmp/params.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy STOP ${DEPLOY_SHA}" \
            --parameters file:///tmp/params.json \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy command finished with status: $STATUS"
            exit 1
          fi
