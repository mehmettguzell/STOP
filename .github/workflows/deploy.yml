name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Build" ]
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy on a manual run, or after the Build workflow's run actually
    # succeeded — workflow_run fires on completion regardless of outcome, so
    # without this a failed build would still trigger (and fail inside) deploy.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GHA_ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          # Only docker-compose.yml ever lands on the server — no repo clone, no
          # source code. It's rewritten from this run's checkout every deploy, so
          # the server self-heals if /opt/STOP is ever lost or edited by hand.
          COMPOSE_B64=$(base64 -w0 docker/docker-compose.yml)

          # Single-quoted heredoc: this (GitHub Actions) shell touches NOTHING in
          # here — every $VAR below is resolved later, by the remote host's own
          # shell, when SSM actually runs it. No double-escaping required.
          REMOTE_SCRIPT=$(cat <<'SCRIPT_EOF'
          set -euo pipefail
          REGION=eu-north-1
          GHCR_REGISTRY=ghcr.io/mehmettguzell

          # Stage timing, logged to stdout so it shows up in the SSM output
          # captured below — lets us see where a slow deploy actually spent
          # its time without guessing.
          ts() { echo "[timing] $(date +%s) $1"; }
          ts "script_start"

          command -v jq >/dev/null 2>&1 || (apt-get update -y && apt-get install -y jq)
          ts "jq_ready"

          get_secret() {
            aws secretsmanager get-secret-value --region "$REGION" --secret-id "$1" \
              --query SecretString --output text
          }

          # Host authenticates to GHCR and Secrets Manager using its own IAM
          # instance role — no long-lived AWS credentials pass through this
          # GitHub Actions run at all. The GHCR pull token itself is a
          # necessary long-lived secret (GitHub has no IAM-style short-lived
          # pull token for private packages), so it's stored in Secrets
          # Manager like everything else, not embedded anywhere.
          ts "secrets_start"
          GHCR_PAT=$(get_secret stop/prod/ghcr-pat | jq -r .token)
          echo "$GHCR_PAT" | docker login ghcr.io --username mehmettguzell --password-stdin
          ts "ghcr_login_done"

          IDENTITY_DB_PASSWORD=$(get_secret stop/prod/identity-db | jq -r .password)
          MATCH_DB_PASSWORD=$(get_secret stop/prod/match-db | jq -r .password)
          COMMUNICATION_DB_PASSWORD=$(get_secret stop/prod/communication-db | jq -r .password)
          NOTIFICATION_DB_PASSWORD=$(get_secret stop/prod/notification-db | jq -r .password)
          JWT_PUBLIC_KEY=$(get_secret stop/prod/jwt-keys | jq -r .public)
          JWT_PRIVATE_KEY=$(get_secret stop/prod/jwt-keys | jq -r .private)
          ts "secrets_done"

          cat > /opt/STOP/.env <<ENVEOF
          SPRING_PROFILES_ACTIVE=prod
          ALLOWED_ORIGIN=https://stophalisaha.duckdns.org
          GHCR_REGISTRY=$GHCR_REGISTRY
          IMAGE_TAG=latest

          COMMUNICATION_DB_NAME=communication_db
          COMMUNICATION_DB_USER=communication_user
          COMMUNICATION_DB_PASSWORD=$COMMUNICATION_DB_PASSWORD
          COMMUNICATION_DB_URL=jdbc:postgresql://communication-db:5432/communication_db

          IDENTITY_DB_NAME=identity_db
          IDENTITY_DB_USER=identity_user
          IDENTITY_DB_PASSWORD=$IDENTITY_DB_PASSWORD
          IDENTITY_DB_URL=jdbc:postgresql://identity-db:5432/identity_db

          MATCH_DB_NAME=match_db
          MATCH_DB_USER=match_user
          MATCH_DB_PASSWORD=$MATCH_DB_PASSWORD
          MATCH_DB_URL=jdbc:postgresql://match-db:5432/match_db

          NOTIFICATION_DB_NAME=notification_db
          NOTIFICATION_DB_USER=notification_user
          NOTIFICATION_DB_PASSWORD=$NOTIFICATION_DB_PASSWORD
          NOTIFICATION_DB_URL=jdbc:postgresql://notification-db:5432/notification_db

          KAFKA_BOOTSTRAP_SERVERS=broker:9092
          REDIS_URL=redis://redis:6379
          MATCH_SERVICE_URL=http://match-service:8082/api/v1

          GATEWAY_IDENTITY_URI=http://identity-service:8081
          GATEWAY_MODERATION_URI=http://identity-service:8081
          GATEWAY_MATCH_URI=http://match-service:8082
          GATEWAY_NOTIFICATION_URI=http://notification-service:8083
          GATEWAY_COMMUNICATION_URI=http://communication-service:8084
          GATEWAY_COMMUNICATION_WS_URI=ws://communication-service:8084

          JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY"
          JWT_PRIVATE_KEY="$JWT_PRIVATE_KEY"
          ENVEOF
          chmod 600 /opt/STOP/.env

          SERVICES="identity-service match-service communication-service notification-service api-gateway"

          # Snapshot the currently-running `latest` as a local `previous` tag
          # BEFORE pulling — this is a pure local retag (no network), so it
          # works even if a given service wasn't rebuilt this run and its
          # `latest` in the registry didn't change. It's the rollback target.
          for svc in $SERVICES; do
            docker tag "$GHCR_REGISTRY/stop/$svc:latest" "$GHCR_REGISTRY/stop/$svc:previous" 2>/dev/null || true
          done

          # Free disk BEFORE pulling fresh layers, but only when actually
          # needed — dangling images/build cache from prior deploys can fill
          # the volume and fail the pull with "no space left on device", but
          # `docker system prune` itself costs a few seconds even when
          # there's nothing to reclaim, so skip it below the threshold
          # instead of paying that cost on every single deploy. This only
          # ever touches untagged/unused data: the `latest` and `previous`
          # tags (and their layers) used for rollback are never removed.
          DISK_USED_PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          if [ "${DISK_USED_PCT:-0}" -ge 80 ]; then
            ts "pre_pull_cleanup_start (disk ${DISK_USED_PCT}% used)"
            docker system prune -f
            ts "pre_pull_cleanup_done"
          else
            ts "pre_pull_cleanup_skipped (disk ${DISK_USED_PCT}% used)"
          fi

          # `--wait --wait-timeout 300` makes Compose itself block until every
          # service (five of them, opened at once) reports healthy and exit
          # non-zero if the 300s budget runs out, instead of a hand-rolled
          # polling loop. The 300s figure matches compose's own
          # start_period: 90s + interval: 30s x retries: 5 headroom for a
          # slow-starting service.
          echo "Deploying latest"
          ts "pull_start"
          docker compose --env-file /opt/STOP/.env -f /opt/STOP/docker-compose.yml pull
          ts "pull_done"

          ts "up_start"
          if docker compose --env-file /opt/STOP/.env -f /opt/STOP/docker-compose.yml \
               up -d --remove-orphans --wait --wait-timeout 300; then
            ts "up_done"
            echo "Deploy succeeded."
          else
            ts "up_failed"
            echo "Healthcheck failed — rolling back to previous (already local, no pull needed)"
            IMAGE_TAG=previous docker compose --env-file /opt/STOP/.env -f /opt/STOP/docker-compose.yml \
              up -d --remove-orphans --wait --wait-timeout 300 \
              || echo "WARNING: rollback healthcheck also failed, manual intervention required"
            ts "rollback_done"
            exit 1
          fi

          docker system prune -f
          ts "script_done"
          SCRIPT_EOF
          )

          # SSM concatenates every "commands" entry into ONE script file and
          # picks the interpreter from that file's first line. Without a
          # shebang it defaults to /bin/sh, which is dash on Amazon
          # Linux/Ubuntu — dash rejects `set -o pipefail` (used inside
          # REMOTE_SCRIPT) and aborts before anything runs, with no
          # stdout/stderr captured. Putting "#!/bin/bash" as its own first
          # array entry makes it the file's actual first line.
          PARAMS=$(jq -n \
            --arg compose_b64 "$COMPOSE_B64" \
            --arg script "$REMOTE_SCRIPT" \
            '{commands: [
              "#!/bin/bash",
              "mkdir -p /opt/STOP",
              ("echo " + $compose_b64 + " | base64 -d > /opt/STOP/docker-compose.yml"),
              $script
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy STOP ${DEPLOY_SHA}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          # 120x10sn = 20dk. Uzaktaki script en kotu durumda pull (~3dk) +
          # ilk saglik beklemesi (5dk) + rollback ve ikinci saglik beklemesi
          # (5dk) kadar surebiliyor; eski 10dk'lik butce buna yetmiyordu.
          STATUS="Pending"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "Deploy command finished with status: $STATUS"
            exit 1
          fi
