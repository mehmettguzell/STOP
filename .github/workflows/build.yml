# NOTE: This is a corrected starting point. It still depends on your
# docker/docker-compose.yml (service names, ports, healthchecks, env_file).
# Reconcile the marked (#>>) points with that file before merging.

name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
#    tags:
#      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  # A release build pushes images; cancelling mid-push can leave partial state.
  cancel-in-progress: false

env:
  GHCR_REGISTRY: ghcr.io/mehmettguzell

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # If one service fails, keep building the others.
      fail-fast: false
      matrix:
        # Release trigger = build ALL services at one consistent version.
        # (paths-filter on a tag push is unreliable: event.before is often the
        #  zero-SHA, so "changed services" is meaningless for a release build.
        #  If you want change-based builds, do it in a SEPARATE workflow that
        #  triggers on `push: branches` / pull_request.)
        service:
          - identity-service
          - match-service
          - communication-service
          - notification-service
          - api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/stop/${{ matrix.service }}
          tags: |
            # format=long,prefix= keeps the FULL commit SHA as the tag,
            # so your compose IMAGE_TAG=${{ github.sha }} still matches.
            type=sha,format=long,prefix=
            type=ref,event=tag
            type=raw,value=latest

      - name: Build image (load into local daemon, DON'T push yet)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate ephemeral CI secrets (.env)
        working-directory: docker
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/ci-private.pem
          openssl rsa -pubout -in /tmp/ci-private.pem -out /tmp/ci-public.pem
          {
            echo "SPRING_PROFILES_ACTIVE=prod"
            echo "ALLOWED_ORIGIN=http://localhost"
            echo "GHCR_REGISTRY=${{ env.GHCR_REGISTRY }}"
            echo "IMAGE_TAG=${{ github.sha }}"
            for svc in COMMUNICATION IDENTITY MATCH NOTIFICATION; do
              echo "${svc}_DB_NAME=ci_db"
              echo "${svc}_DB_USER=ci_user"
              echo "${svc}_DB_PASSWORD=ci-only-not-a-real-secret"
            done
            echo "COMMUNICATION_DB_URL=jdbc:postgresql://communication-db:5432/ci_db"
            echo "IDENTITY_DB_URL=jdbc:postgresql://identity-db:5432/ci_db"
            echo "MATCH_DB_URL=jdbc:postgresql://match-db:5432/ci_db"
            echo "NOTIFICATION_DB_URL=jdbc:postgresql://notification-db:5432/ci_db"
            echo "KAFKA_BOOTSTRAP_SERVERS=broker:9092"
            echo "REDIS_URL=redis://redis:6379"
            echo "MATCH_SERVICE_URL=http://match-service:8082/api/v1"
            echo "GATEWAY_IDENTITY_URI=http://identity-service:8081"
            echo "GATEWAY_MODERATION_URI=http://identity-service:8081"
            echo "GATEWAY_MATCH_URI=http://match-service:8082"
            echo "GATEWAY_NOTIFICATION_URI=http://notification-service:8083"
            echo "GATEWAY_COMMUNICATION_URI=http://communication-service:8084"
            echo "GATEWAY_COMMUNICATION_WS_URI=ws://communication-service:8084"
          } > .env
          # Multi-line PEM in a compose .env is a known footgun, so strip the
          # PEM header/footer and join the remaining base64 body into one
          # line. RsaKeyConfig only needs the base64 body (it strips any
          # header/footer/whitespace itself), and compose/the app read these
          # under JWT_PUBLIC_KEY / JWT_PRIVATE_KEY, not a _B64 suffix.
          {
            echo "JWT_PUBLIC_KEY=$(grep -v '^-----' /tmp/ci-public.pem | tr -d '\n')"
            echo "JWT_PRIVATE_KEY=$(grep -v '^-----' /tmp/ci-private.pem | tr -d '\n')"
          } >> .env

      # ---- VERIFY (non-gateway services) ----------------------------------
      - name: Boot service + its dependencies via docker compose
        if: matrix.service != 'api-gateway'
        working-directory: docker
        run: |
          #>> If your compose file uses `depends_on: { condition: service_healthy }`,
          #>> `up -d <service>` already starts deps. If not, list deps explicitly, e.g.:
          #>> docker compose up -d <service>-db kafka redis ${{ matrix.service }}
          docker compose -f docker-compose.yml up -d ${{ matrix.service }}
          timeout 150 bash -c \
            'until [ "$(docker inspect -f "{{.State.Health.Status}}" ${{ matrix.service }} 2>/dev/null)" = "healthy" ]; do sleep 5; done' \
            || { docker compose -f docker-compose.yml logs ${{ matrix.service }}; exit 1; }
          #>> The container HEALTHCHECK is your real integration probe IF it hits
          #>> /actuator/health. If it only checks TCP, add an in-network probe here:
          #>> docker compose exec -T ${{ matrix.service }} curl -fsS http://localhost:<port>/actuator/health

      # ---- VERIFY (api-gateway, no downstream deps in this job) ------------
      - name: Smoke-boot api-gateway
        if: matrix.service == 'api-gateway'
        run: |
          IMAGE="${{ env.GHCR_REGISTRY }}/stop/api-gateway:${{ github.sha }}"
          docker run -d --name gw-smoke \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e JWT_PUBLIC_KEY="$(cat /tmp/ci-public.pem)" \
            -e GATEWAY_IDENTITY_URI=http://identity-service:8081 \
            -e GATEWAY_MODERATION_URI=http://identity-service:8081 \
            -e GATEWAY_MATCH_URI=http://match-service:8082 \
            -e GATEWAY_NOTIFICATION_URI=http://notification-service:8083 \
            -e GATEWAY_COMMUNICATION_URI=http://communication-service:8084 \
            -e GATEWAY_COMMUNICATION_WS_URI=ws://communication-service:8084 \
            "$IMAGE"
          sleep 20
          docker logs gw-smoke | tail -50
          docker inspect -f '{{.State.Running}}' gw-smoke | grep -q true

      # ---- PUSH (only AFTER verification passes) ---------------------------
      - name: Push verified image (sha + tag + latest)
        if: success()
        run: |
          # meta.outputs.tags is newline-separated; push each one.
          echo "${{ steps.meta.outputs.tags }}" | while read -r t; do
            [ -n "$t" ] && docker push "$t"
          done

      # ---- CLEANUP (always) -----------------------------------------------
      - name: Cleanup
        if: always()
        working-directory: docker
        run: |
          docker rm -f gw-smoke 2>/dev/null || true
          docker compose -f docker-compose.yml down -v 2>/dev/null || true